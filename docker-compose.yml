services:
  api:
    build: .
    image: browser-agent-toolkit:latest
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
    # Chromium needs more than the default 64 MB /dev/shm.
    shm_size: "1gb"
    restart: unless-stopped

  # Optional: automatic HTTPS in front of the API. Uncomment and set your domain
  # in deploy/Caddyfile, then expose ports 80/443 instead of 8080.
